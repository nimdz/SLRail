<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Rail</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-queries.css">

    <!-- Cancel & Update btns -->
    <script>
        window.addEventListener('load', (event) => {
            document.getElementById('cancelButton').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            document.getElementById('updatePro').addEventListener('click', function(event) {
                event.preventDefault();
                var btn = document.getElementById('updatePro');
                if (btn.value === 'Start') {
                    btn.value = 'End';
                    btn.style.backgroundColor = '#FF0000';
                } else {
                    btn.value = 'Start';
                    btn.style.backgroundColor = '#0000FF'; // Reset to default color
                }
            });

        });
    </script>
</head>
<body>

    <div class="sidebar">
        <a href="index_pa.html" class="company-logo">
            <img src="./assets/asset 1.png" alt="company logo">
        </a>
        <a href="index_pa.html" class="hover-link">Dashboard</a>
        
        <a href="announcements_view_pa.html" class="hover-link">Announcements</a>

        <a href="tickets_booking_pa.html" class="hover-link">Book Ticket</a>

        <a href="schedules_view_pa.html" class="hover-link">Schedule</a>

        <a href="live_location_view_pa.html" class="hover-link active">Live Location</a>

        <a href="feedbacks_send_pa.html" class="hover-link">Reviews & Feedbacks</a>

        <div class="dropdown">
            <a href="#" class="hover-link">Profile <span class="dropdown-indicator">&#9662;</span></a>
            <div class="dropdown-menu">
                <a href="profile_view_pa.html" class="hover-link">View</a>
                <a href="profile_update_pa.html" class="hover-link">Update</a>
                <a href="profile_changePwd_pa.html" class="hover-link">Change Password</a>
            </div>
        </div>
        <a href="/first.html" class="hover-link">Log Out</a>
    </div>
    
    
    
    <!-- Page content -->
    <div class="content">
        <div class="container" style="background-color: brown; text-align: center; padding: 10px;">
            <p style="color: white; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">
                <span style="font-weight: bold;">SL Rail - </span>
                <span style="font-style: normal;">Revolutionizing Sri Lankan Rail Travel</span>
            </p>
        </div>
    <section class="features-section">
        <div class="container">    
            <h3>View Live Location</h3>
        </div>
        <div class="container">
            <div class="container" style="text-align: center;">
                <img src="assets/map.jpg" style="width: 100%; height: auto; display: inline-block;">
            </div>
        </div>
        <div class="container" style="margin-left: 0px; margin-top: 20px;">
            <div class="row">
                <div class="col-25">
                  <label for="uname">Train Number</label>
                </div>
                <div class="col-75">
                  <input type="text" id="uname" name="username" placeholder="1105">
                </div>
              </div>
              <div>
                <input type="submit" value="Search" class="update-btn", id="updatePro" style="text-align: center;">
              </div>
            <div class="row">
                <div class="column">
                  <table class="zebra-table">
                    <tr>
                      <th>Source</th>
                      <th>Departure Time</th>
                    </tr>
                    <tr>
                       <td><input type="text" id="fieldName" name="fieldName" value="Matara"></td>
                       <td><input type="text" id="fieldName" name="fieldName" value="7.30 AM"></td>
                    </tr>
                  </table>
                </div>
                <div>
                  <table class="zebra-table">
                    <tr>
                      <th>Destination</th>
                      <th>Arrival Time</th>
                    </tr>
                    <tr>
                        <td><input type="text" id="fieldName" name="fieldName" value="Jaffna"></td>
                        <td><input type="text" id="fieldName" name="fieldName" value="4.30 PM"></td>
                    </tr>
                  </table>
                  <div>
                </div>
                </div>
              </div>
        </div>           
    </section>
    </div>


    <!-- subfooter -->
    <div class="subfooter">
        <div class="subfooter-container">
            <h5>&copy; 2023 SL Rail. All rights reserved.</h5>
        </div>
    </div>
</body>

</html>
